# Public API of the Python, R, Octave and Julia bindings (#419).
#
# Checked by tools/checks/binding_api.py:
#   - in the Linux build jobs, against the names each binding exposes
#     (written by its api_dump test: Python/api_dump, Julia/api_dump,
#     Octave/ApiDump, testthat test-ApiDump.R): a name missing from a binding
#     or exposed but not listed here fails the job;
#   - in the binding-api job, that every binding test file is run.
#
# What a binding "exposes" for each scope:
#   module         Python: public non-module names of pylibkriging;
#                  R: exported names, except the class members below (S3
#                  generics); Octave: the .m files next to Kriging.m;
#                  Julia: exported names, except the class methods below.
#   <class>        Python: public attributes of the class; R: functions
#                  `k$name()` of a fitted object; Octave: methods(<class>)
#                  minus the handle ones; Julia: methods of jlibkriging
#                  taking a <class> argument.
#   Optim, LinearAlgebra, Random
#                  R: namespace functions optim_* / linalg_* / random_*.
#
# Entries: `scopes.<scope>.members.<name>`, where <name> is the C++ name.
#   <name>:                             same name in every binding
#   <name>: {julia: fit!}               another name in that binding
#   <name>: {r: "not exposed: <why>"}   a gap, decided and explained
#   <name>: {only: [r], reason: <why>}  specific to some bindings
#   <name>: {optional: <why>}           may be absent (e.g. Debug builds only)
# A scope missing from a binding: `bindings: {julia: "not exposed: <why>"}`.
#
# Each "not exposed" that is not a language idiom is a known gap to fix.

scopes:
  module:
    members:
      Kriging:
      WarpKriging:
      MLPKriging:
      NestedKriging:
      Optim:
        r: "not exposed: internal rlibkriging:::optim_* functions (gap)"
        julia: "not exposed: no Optim settings in Julia (gap, #423)"
      load:
        octave: "not exposed: load_kriging(), as `load` would shadow Octave's built-in load"
      load_kriging:
        python: "not exposed: load()"
        r: "not exposed: load()"
      load.Kriging:
        only: [r]
        reason: "S3 method exported by the R package"
      load_warp_kriging:
        only: [julia]
        reason: "Julia per-class loaders (no static methods in Julia)"
      load_mlp_kriging:
        only: [julia]
        reason: "Julia per-class loaders (no static methods in Julia)"
      load_nested_kriging:
        only: [julia]
        reason: "Julia per-class loaders (no static methods in Julia)"
      subsetOfData:
        python: "not exposed: Kriging.subsetOfData (static method)"
        octave: "not exposed: Kriging.subsetOfData (static method)"
      class_saved:
        only: [octave]
        reason: "Octave helper of load_kriging, reading the saved class name"
      Params:
        only: [octave]
        reason: "Octave helper class for named parameters"
      KrigingParameters:
        only: [python]
        reason: "Python type of the `parameters` argument"
      RegressionModel:
        only: [python]
        reason: "Python enum of the regression models"
      Constant:
        only: [python]
        reason: "RegressionModel value exported at module level by pybind11"
      Linear:
        only: [python]
        reason: "RegressionModel value exported at module level by pybind11"
      Interactive:
        only: [python]
        reason: "RegressionModel value exported at module level by pybind11"
      Quadratic:
        only: [python]
        reason: "RegressionModel value exported at module level by pybind11"
      None:
        only: [python]
        reason: "RegressionModel value exported at module level by pybind11"
      RandomGenerator:
        only: [python]
        reason: "Python test helper (std::mt19937), unrelated to libKriging's Random"
      WrappedPyKriging:
        only: [python]
        reason: "pybind11 class behind Kriging (Kriging is an alias)"
      WrappedPyWarpKriging:
