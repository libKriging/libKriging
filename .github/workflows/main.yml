name: Build and tests

# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#on
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'v*' # done in release
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '0 2 * * SAT'

# About image content:
# https://github.com/actions/virtual-environments

# Global GHA doc:
# https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions

# To define local environment variable inside build steps
# https://github.community/t/support-saving-environment-variables-between-steps/16230

# Support for YAML anchors:
# https://github.community/t/support-for-yaml-anchors/16128


# Default working directory is equivalent to
#   working-directory: ${{github.workspace}}
# always set shell (could be powershell in windows environment)
#   shell: bash


env:
  DEBUG_CI: true
  # cmake >= 4 rejects dependencies declaring cmake_minimum_required < 3.5
  # (the pinned pybind11 submodule does); this env is honored by cmake as the
  # CMAKE_POLICY_VERSION_MINIMUM variable and restores the old behavior.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  guideline-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # submodules not required here
          fetch-depth: 2 # git rev-parse HEAD^ will fail without this

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4

      - name: before_script
        shell: bash
        run: tools/common/before_script.sh

      - name: check
        shell: bash
        run: tools/checks/test.sh

      - name: Check version consistency
        shell: bash
        run: python3 tools/release/check_versions.py

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      # TEMPORARY — matrix trimmed to just the two configs with an open,
      # intermittent Windows native-crash investigation (R Windows:
      # docs/dev/WindowsRSegfaultTestEstimNone.md; Julia Windows: same doc's
      # "Julia Windows / core ctest segfault cluster" section). Restore the
      # full matrix with `git revert` of the commit that introduced this
      # trim (based on e4f076a6) once the investigation concludes.
      matrix:
        include:
          - name: "R Windows"
            os: windows-latest
            mode: Release
            enable_R: on
            r_test_repeat: 8 # TEMPORARY: see note above
          - name: "Julia Windows"
            os: windows-latest
            mode: Release
            enable_julia: on
            ctest_repeat: 8 # TEMPORARY: see note above
            ctest_extra_args: "-R Nystrom|Vecchia|NestedKriging|LinearAlgebra" # TEMPORARY: see note above
            disable_catch_windows_seh: on # TEMPORARY: see note above -- lets WER capture a .dmp

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          rtools-version: '' # Default Rtools version, matching the R version
          use-public-rspm: true
        if: matrix.enable_R == 'on'

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
        if: matrix.enable_julia == 'on'

      # Note: Miniconda is installed directly in tools/windows/install.sh for all Windows jobs
      # This provides BLAS/LAPACK dependencies and Python environment consistently

      - name: Define local variables
        shell: bash
        run: |
          echo "MODE=${{matrix.mode}}"                           >> $GITHUB_ENV
          echo "ENABLE_PYTHON_BINDING=${{matrix.enable_python}}" >> $GITHUB_ENV
          echo "ENABLE_OCTAVE_BINDING=${{matrix.enable_octave}}" >> $GITHUB_ENV
          echo "ENABLE_MATLAB_BINDING=${{matrix.enable_matlab}}" >> $GITHUB_ENV
          echo "ENABLE_R_BINDING=${{matrix.enable_R}}"           >> $GITHUB_ENV
          echo "ENABLE_JULIA_BINDING=${{matrix.enable_julia}}"   >> $GITHUB_ENV
          echo "ENABLE_COVERAGE=${{matrix.enable_coverage}}"     >> $GITHUB_ENV
          echo "ENABLE_MEMCHECK=${{matrix.enable_memcheck}}"     >> $GITHUB_ENV
          echo "DISABLE_OPENMP=${{matrix.disable_openmp}}"       >> $GITHUB_ENV
          # TEMPORARY (segfault investigation, see matrix comment above):
          # empty when unset, which tools/*/test.sh's ${VAR:-default} falls
          # back on -- no-op outside the two trimmed-matrix entries.
          echo "R_TEST_REPEAT=${{matrix.r_test_repeat}}"         >> $GITHUB_ENV
          echo "CTEST_REPEAT=${{matrix.ctest_repeat}}"           >> $GITHUB_ENV
          echo "CTEST_EXTRA_ARGS=${{matrix.ctest_extra_args}}"   >> $GITHUB_ENV
          echo "DISABLE_CATCH_WINDOWS_SEH=${{matrix.disable_catch_windows_seh}}" >> $GITHUB_ENV

      - name: Define local variables Unix Like
        shell: bash
        run: |
          if [ "${ENABLE_R_BINDING}" == "on" ]; then
            echo "BUILD_NAME=r-linux-macos"  >> $GITHUB_ENV
          else
            echo "BUILD_NAME=linux-macos"    >> $GITHUB_ENV
          fi
        if: runner.os != 'Windows'

      - name: Define local variables Windows
        shell: bash
        run: |
          if [ "${ENABLE_OCTAVE_BINDING}" == "on" ]; then
            echo "BUILD_NAME=octave-windows" >> $GITHUB_ENV
          elif [ "${ENABLE_R_BINDING}" == "on" ]; then
            echo "BUILD_NAME=r-windows"      >> $GITHUB_ENV
          else
            echo "BUILD_NAME=windows"        >> $GITHUB_ENV
          fi
        if: runner.os == 'Windows'

      - name: pre-install-linux
        shell: bash
        run: |
          if [ "${{matrix.force_update}}" == "on" ]; then
            sudo apt update
          fi
          # Remove OpenMP packages if requested to test builds without OpenMP
          if [ "${DISABLE_OPENMP}" == "on" ]; then
            echo "=== Removing OpenMP packages to test build without OpenMP ==="
            # Remove OpenMP development packages (but keep runtime libs that GCC depends on)
            sudo apt-get remove -y libomp-dev libomp5-dev || true
            # Verify OpenMP is not available for CMake
            echo "Checking for OpenMP availability:"
            echo '#include <omp.h>' | gcc -fopenmp -E - 2>&1 || echo "OpenMP headers not found (expected)"
          fi
          sudo apt install liblapack-dev python3-pip
          if [ "${ENABLE_OCTAVE_BINDING}" == "on" ]; then
            sudo apt install -qy octave liboctave-dev
          fi
          if [ "${ENABLE_MATLAB_BINDING}" == "on" ]; then
            sudo apt install -qy intel-mkl
          fi
          if [ "${ENABLE_R_BINDING}" == "on" ]; then
            sudo apt install -qy liblapack-dev gfortran # r-base
          fi
          if [ "${ENABLE_COVERAGE}" == "on" ]; then
            sudo apt install -qy lcov
          fi
          if [ "${ENABLE_MEMCHECK}" == "on" ]; then
            sudo apt install -qy valgrind python3-setuptools
          fi
        if: runner.os == 'Linux' # or use $RUNNER_OS

      - name: pre-install-matlab
        uses: matlab-actions/setup-matlab@v2
        if: matrix.enable_matlab == 'on'
        with:
          token: ${{ secrets.MATHWORKS_API_TOKEN }}
      - name: install
        shell: bash
        run: tools/${BUILD_NAME}/install.sh

      - name: Setup cmake
        uses: lukka/get-cmake@v4.3.2
        with:
          # >= 4.2 required: the windows-2025-vs2026 runner image only ships
          # Visual Studio 2026, whose generator ("Visual Studio 18 2026") was
          # added in cmake 4.2 (older cmake falls back to NMake and then
          # breaks on CMAKE_GENERATOR_PLATFORM). See the global
          # CMAKE_POLICY_VERSION_MINIMUM env for the cmake-4.x compatibility
          # shim needed by the pybind11 submodule.
          cmakeVersion: '~4.2.0'

      - name: before_script
        shell: bash
        run: tools/common/before_script.sh

      - name: Enable Windows crash dumps (TEMPORARY — segfault investigation)
        # WER LocalDumps: writes a full-memory .dmp for ANY process that
        # crashes while this key is set, without needing to know in advance
        # which .exe will segfault. HKCU (not HKLM) so it needs no elevation.
        # Placed BEFORE "script": build.sh runs its own embedded `ctest`
        # (tools/windows/build.sh, right after the build, before `install`)
        # and that's where the Julia-Windows segfault cluster was actually
        # first caught with this infra in place -- putting this step after
        # "script" would be too late. See
        # docs/dev/WindowsRSegfaultTestEstimNone.md.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE "crash_dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dumpDir -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 20 -Type DWord
          Write-Host "Crash dumps (if any) will be written to $dumpDir"

      - name: script
        shell: bash
        run: tools/${BUILD_NAME}/build.sh
        id: script
        continue-on-error: true

      - name: test
        shell: bash
        run: tools/${BUILD_NAME}/test.sh
        id: test
        if: steps.script.outcome == 'success'
        continue-on-error: true

      - if: steps.script.outcome != 'success' || steps.test.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ runner.os }}
          path: |
            **/*.txt
            **/*.log
            **/*.pdf
            **/*.Rdata
            **/*.rds
            **/*.zip
            **/*.tgz
            **/*.tar.gz
            **/*.dmp
      
      - if: steps.test.outcome != 'success'
        run: exit 1

      - name: publish_report
        shell: bash
        run: |
          cd build
          lcov --list coverage.info
          coveralls-lcov coverage.info
        if: matrix.enable_coverage == 'on'
