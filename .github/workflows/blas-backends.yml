name: BLAS backends

# The thread-count control of the library per BLAS backend
# (docs/dev/parallel.md 5, docs/dev/rationalization/T9-blas-backends-ci.md):
# - Linux, oneMKL: an OpenBLAS build with the oneMKL wheel preloaded
#   (LD_PRELOAD), and a build linked to oneMKL (Armadillo's ARMA_FindMKL finds
#   mkl_rt), each run with the GNU (libgomp) and INTEL (libiomp5) threading
#   layers, and the OpenBLAS build alone;
# - macOS arm64: Apple Accelerate (Armadillo's default there).
# The [backend] cases of BlasBackendTest check the backend that is loaded
# (LK_EXPECT_BLAS makes a backend that failed to load an error, not a skip).
#
# Runners: the repository's self-hosted runners (dedicated to long runs and to
# parallelism / heavy BLAS backends; ephemeral, sudo available, any Linux
# distribution) for branches of this repository and manual runs; GitHub-hosted
# runners for pull requests from forks, which must not run code on the
# self-hosted machines. Labels: GitHub's automatic ones (self-hosted + OS),
# overridable with the repository variables LK_SELF_HOSTED_LINUX /
# LK_SELF_HOSTED_MACOS (JSON array, e.g. ["self-hosted.linux"]).
# Ephemeral runners start empty: every tool and MKL are looked for first and
# installed only when missing.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/blas-backends.yml'
  workflow_dispatch:

# A new push to the PR cancels the run of the previous one (runners are shared
# with main.yml; obsolete runs only delay the current one)
concurrency:
  group: blas-backends-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # cmake >= 4 rejects dependencies declaring cmake_minimum_required < 3.5
  # (pinned pybind11 submodule), as in main.yml
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  MKL_VERSION: "2024.2.2"
  INTEL_OPENMP_VERSION: "2024.2.1"
  TBB_VERSION: "2021.13.1"

jobs:
  linux-mkl:
    name: "Linux ${{ matrix.name }}"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.LK_SELF_HOSTED_LINUX || '["self-hosted","Linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "OpenBLAS build, oneMKL preloaded"
            link: openblas
          - name: "oneMKL linked"
            link: mkl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools, OpenBLAS and oneMKL (looked for first, installed if missing)
        shell: bash
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
          ARCH=$(uname -m)
          if command -v apt-get >/dev/null; then PM=apt
          elif command -v dnf >/dev/null; then PM=dnf
          elif command -v zypper >/dev/null; then PM=zypper
          else PM=none; fi
          echo "arch $ARCH, package manager $PM"
          # unversioned .so (link time); no pipe into grep -q: with pipefail
          # (GitHub's bash) the SIGPIPE of the writer fails the test
          has_lib() { for f in /usr/lib*/$1 /usr/lib*/*/$1 /usr/lib*/*/*/$1 /usr/local/lib*/$1; do [ -e "$f" ] && return 0; done; return 1; }
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v ninja >/dev/null || missing+=(ninja)
          command -v g++ >/dev/null || missing+=(g++)
          python3 -m pip --version >/dev/null 2>&1 || missing+=(pip)
          has_lib libopenblas.so || missing+=(openblas)
          has_lib liblapack.so || missing+=(lapack)
          echo "missing: ${missing[*]:-none}"
          if [ ${#missing[@]} -gt 0 ]; then
            case "$PM" in
              apt) $SUDO apt-get update -q
                   $SUDO apt-get install -qy cmake ninja-build g++ python3-pip libopenblas-pthread-dev liblapack-dev ;;
              dnf) $SUDO dnf install -y cmake ninja-build gcc-c++ python3-pip openblas-devel lapack-devel ;;
              zypper) $SUDO zypper -n install cmake ninja gcc-c++ python3-pip openblas-devel lapack-devel ;;
              *) echo "::error::missing ${missing[*]} and no known package manager"; exit 1 ;;
            esac
          fi
          cmake --version | head -1
          # Ubuntu's OpenBLAS Cooperlake kernels gave wrong results on Xeon
          # 6973P-C runners (main.yml, #429): its AVX2 kernels, as the other
          # Linux jobs (x86 only). No effect on MKL.
          if [ "$ARCH" == "x86_64" ]; then echo "OPENBLAS_CORETYPE=Haswell" >> $GITHUB_ENV; fi

          # oneMKL (x86_64 only): an installed oneAPI MKL first, else the
          # pinned pip wheels
          MKL_LIB=""; IOMP_LIB=""; TBB_LIB=""
          if [ "$ARCH" == "x86_64" ]; then
            for d in "${MKLROOT:-/nonexistent}/lib" "${MKLROOT:-/nonexistent}/lib/intel64" \
                     /opt/intel/oneapi/mkl/latest/lib /opt/intel/oneapi/mkl/latest/lib/intel64; do
              if [ -f "$d/libmkl_rt.so.2" ]; then MKL_LIB=$d; break; fi
            done
            for d in /opt/intel/oneapi/compiler/latest/lib /opt/intel/oneapi/compiler/latest/linux/compiler/lib/intel64_lin; do
              if [ -f "$d/libiomp5.so" ]; then IOMP_LIB=$d; break; fi
            done
            [ -d /opt/intel/oneapi/tbb/latest/lib/intel64/gcc4.8 ] && TBB_LIB=/opt/intel/oneapi/tbb/latest/lib/intel64/gcc4.8
            if [ -n "$MKL_LIB" ] && [ -n "$IOMP_LIB" ]; then
              echo "installed oneMKL: $MKL_LIB (libiomp5: $IOMP_LIB)"
            else
              mkdir -p "$RUNNER_TEMP/mkl" && cd "$RUNNER_TEMP/mkl"
              python3 -m pip download --no-deps --only-binary=:all: \
                mkl==${MKL_VERSION} intel-openmp==${INTEL_OPENMP_VERSION} tbb==${TBB_VERSION}
              for w in *.whl; do python3 -m zipfile -e "$w" x/; done
              MKL_LIB="$RUNNER_TEMP/mkl/x/mkl-${MKL_VERSION}.data/data/lib"
              IOMP_LIB="$RUNNER_TEMP/mkl/x/intel_openmp-${INTEL_OPENMP_VERSION}.data/data/lib"
              TBB_LIB="$RUNNER_TEMP/mkl/x/tbb-${TBB_VERSION}.data/data/lib"
              rm -f *.whl
              echo "oneMKL wheel ${MKL_VERSION}: $MKL_LIB"
            fi
            ls "$MKL_LIB"/libmkl_rt.so.2 "$IOMP_LIB"/libiomp5.so
            echo "MKL_AVAILABLE=1" >> $GITHUB_ENV
          else
            echo "::warning::no oneMKL on $ARCH: MKL steps skipped"
            echo "MKL_AVAILABLE=0" >> $GITHUB_ENV
          fi
          echo "MKL_LIB=$MKL_LIB" >> $GITHUB_ENV
          echo "MKL_LD_LIBRARY_PATH=$MKL_LIB:$IOMP_LIB${TBB_LIB:+:$TBB_LIB}" >> $GITHUB_ENV

      - name: Runner
        shell: bash
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_ENVIRONMENT:-unknown})"
          cat /etc/os-release 2>/dev/null | grep -E "^PRETTY_NAME" || true
          LC_ALL=C lscpu | grep -E "^(Architecture|Model name|Vendor ID|CPU\(s\)|Thread|Core|Socket)" || true
          nproc

      - name: Configure and build (Release, C++ only)
        if: matrix.link == 'openblas' || env.MKL_AVAILABLE == '1'
        shell: bash
        run: |
          # FlexiBLAS (Fedora / RHEL default BLAS) would be found first by
          # Armadillo: the jobs test OpenBLAS and MKL themselves
          EXTRA=(-DALLOW_FLEXIBLAS_LINUX=OFF)
          if [ "${{ matrix.link }}" == "mkl" ]; then
            # ARMA_FindMKL looks for mkl_rt (find_library): give it the wheel's
            EXTRA+=(-Dmkl_rt_LIBRARY="$MKL_LIB/libmkl_rt.so.2")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON_BINDING=off -DENABLE_OCTAVE_BINDING=off -DENABLE_MATLAB_BINDING=off \
            -DCMAKE_INSTALL_LIBDIR=lib "${EXTRA[@]}" | tee cmake.log
          grep -E "MKL_FOUND|OpenBLAS_FOUND|Found MKL" cmake.log || true
          if [ "${{ matrix.link }}" == "mkl" ]; then grep -q "MKL_FOUND = YES" cmake.log; fi
          cmake --build build -j "$(nproc)"
          ldd build/src/lib/libKriging.so | grep -E "mkl|openblas|lapack|blas|gomp|iomp" || true

      - name: Tests, OpenBLAS alone
        if: matrix.link == 'openblas'
        shell: bash
        run: |
          cd build
          export LK_EXPECT_BLAS=openblas
          ./tests/BlasBackendTest
          # serial, as tools/linux-macos/test.sh: timing assertions
          # (KrigingWarmRestartTest) and BLAS thread teams of two tests would
          # compete for the cores
          ctest --output-on-failure

      - name: Tests, oneMKL GNU threading layer
        if: always() && env.MKL_AVAILABLE == '1'
        shell: bash
        run: |
          cd build
          export LK_EXPECT_BLAS=mkl MKL_THREADING_LAYER=GNU LD_LIBRARY_PATH="$MKL_LD_LIBRARY_PATH"
          if [ "${{ matrix.link }}" == "openblas" ]; then export LD_PRELOAD="$MKL_LIB/libmkl_rt.so.2"; fi
          ./tests/BlasBackendTest
          # Known limitation (T9 log, parallel.md 5): a fork() while other
          # threads run MKL can leave MKL's fast memory manager locked in the
          # child; that case runs below with MKL's documented workaround.
          rc=0
          ctest --output-on-failure -E "fork\(\) during concurrent fits" || rc=1
          MKL_DISABLE_FAST_MM=1 ctest --output-on-failure -R "fork\(\) during concurrent fits" || rc=1
          exit $rc

      - name: Tests, oneMKL INTEL threading layer
        if: always() && env.MKL_AVAILABLE == '1'
        shell: bash
        run: |
          cd build
          export LK_EXPECT_BLAS=mkl MKL_THREADING_LAYER=INTEL LD_LIBRARY_PATH="$MKL_LD_LIBRARY_PATH"
          if [ "${{ matrix.link }}" == "openblas" ]; then export LD_PRELOAD="$MKL_LIB/libmkl_rt.so.2"; fi
          ./tests/BlasBackendTest
          # Known limitation (T9 log, parallel.md 5): a fork() while other
          # threads run MKL can leave MKL's fast memory manager locked in the
          # child; that case runs below with MKL's documented workaround.
          rc=0
          ctest --output-on-failure -E "fork\(\) during concurrent fits" || rc=1
          MKL_DISABLE_FAST_MM=1 ctest --output-on-failure -R "fork\(\) during concurrent fits" || rc=1
          exit $rc

      - name: MKL_VERBOSE thread counts of a BFGS4 fit
        if: always() && env.MKL_AVAILABLE == '1'
        continue-on-error: true
        shell: bash
        run: |
          cd build
          export MKL_THREADING_LAYER=GNU LD_LIBRARY_PATH="$MKL_LD_LIBRARY_PATH" MKL_VERBOSE=1
          if [ "${{ matrix.link }}" == "openblas" ]; then export LD_PRELOAD="$MKL_LIB/libmkl_rt.so.2"; fi
          ./tests/BlasBackendTest "MKL: each multistart worker runs its BLAS at its share" > verbose.log 2>&1 || true
          grep "^\[backend\]" verbose.log || true
          echo "MKL_VERBOSE calls per NThr (callers: workers and calling thread):"
          grep -o "NThr:[0-9]*" verbose.log | sort | uniq -c || true

      - name: Multistart timing
        if: always() && (matrix.link == 'openblas' || env.MKL_AVAILABLE == '1')
        continue-on-error: true
        shell: bash
        run: |
          cd build
          echo "== OpenBLAS / linked BLAS"; ./tests/BlasBackendTest "[.timing]"
          [ "$MKL_AVAILABLE" == "1" ] || exit 0
          export LD_LIBRARY_PATH="$MKL_LD_LIBRARY_PATH"
          if [ "${{ matrix.link }}" == "openblas" ]; then export LD_PRELOAD="$MKL_LIB/libmkl_rt.so.2"; fi
          echo "== oneMKL GNU"; MKL_THREADING_LAYER=GNU ./tests/BlasBackendTest "[.timing]"

  macos-accelerate:
    name: "macOS Accelerate"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.LK_SELF_HOSTED_MACOS || '["self-hosted","macOS"]') || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools (looked for first, installed if missing)
        shell: bash
        run: |
          xcode-select -p >/dev/null || { echo "::error::Xcode command line tools missing"; exit 1; }
          if ! command -v cmake >/dev/null; then
            if command -v brew >/dev/null; then brew install cmake; else python3 -m pip install --user cmake && echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH; fi
          fi

      - name: Runner
        shell: bash
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_ENVIRONMENT:-unknown}), $(uname -m)"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu hw.perflevel0.physicalcpu 2>/dev/null || true

      - name: Configure and build (Release, C++ only)
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON_BINDING=off -DENABLE_OCTAVE_BINDING=off -DENABLE_MATLAB_BINDING=off \
            -DCMAKE_INSTALL_LIBDIR=lib | tee cmake.log
          grep -i "accelerate" cmake.log || true
          cmake --build build -j "$(sysctl -n hw.logicalcpu)"
          otool -L build/src/lib/libKriging.dylib

      - name: Tests
        shell: bash
        run: |
          cd build
          export LK_EXPECT_BLAS=accelerate
          ./tests/BlasBackendTest
          # MLPKriging calibration (#407): its single-start case stops at a poor
          # mean on macOS Release (coverage 0.72 < 0.8), not a BLAS-backend
          # matter (T9 log, section 5; identical values on master and this
          # branch on Linux). Run below, reported, not blocking; main.yml's
          # macOS job keeps it blocking.
          ctest --output-on-failure -E "MLPKriging predictive variance is calibrated"

      - name: Known limitation, reported (MLPKriging calibration, single start, macOS Release)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd build
          ctest --output-on-failure -R "MLPKriging predictive variance is calibrated"

      - name: Multistart timing (Accelerate, BLASSetThreading, VECLIB_MAXIMUM_THREADS)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd build
          echo "== default"; ./tests/BlasBackendTest "[.timing]"
          echo "== VECLIB_MAXIMUM_THREADS=1"; VECLIB_MAXIMUM_THREADS=1 ./tests/BlasBackendTest "[.timing]"
