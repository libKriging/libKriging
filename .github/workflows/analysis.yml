name: Code Analysis

# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#on
on:
  # branches are tested through their pull request (one run per commit, not
  # one for the push and one for the pull request); master on push
  push:
    branches:
      - master
    tags-ignore:
      - 'v*' # done in release
  pull_request:
    branches:
      - '*'
  workflow_dispatch: # test a branch without a pull request
  schedule:
    - cron: '0 2 * * SAT'

# About image content:
# https://github.com/actions/virtual-environments/blob/ubuntu18/20201210.0/images

# Global GHA doc:
# https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions

# To define local environment variable inside build steps
# https://github.community/t/support-saving-environment-variables-between-steps/16230

# Support for YAML anchors:
# https://github.community/t/support-for-yaml-anchors/16128


# Default working directory is equivalent to
#   working-directory: ${{github.workspace}}
# always set shell (could be powershell in windows environment)
#   shell: bash


# One run per pull request (or branch) and workflow: a new push to a pull
# request cancels its run in progress; master pushes and scheduled runs are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBUG_CI: true

jobs:
  guideline-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # submodules not required here
          fetch-depth: 2 # git rev-parse HEAD^ will fail without this

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4

      - name: before_script
        shell: bash
        run: tools/common/before_script.sh

      - name: check
        shell: bash
        run: tools/checks/test.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Coverage mode"
            os: ubuntu-22.04
            mode: Debug
            enable_python: on
            enable_octave: on
            enable_coverage: on
            force_update: on
            # Debug + coverage build and tests take 25-30 min on ubuntu-22.04
            # (master, 2026-10-29: 29 min; one run cancelled at the former
            # 30 min default)
            timeout_minutes: 60
            # /!\ need after_success
          - name: "Memcheck mode"
            os: ubuntu-22.04
            mode: Debug
            enable_python: on
            enable_matlab: off  # disabled: requires MATHWORKS_API_TOKEN secret
            enable_memcheck: on
            force_update: on
            # valgrind run: 1h28 (pull_request) to > 2h (push, cancelled at
            # the former 120 min) on #445, 2026-11-05
            timeout_minutes: 180
          - name: "Address Sanitizer"
            os: ubuntu-22.04
            mode: Debug
            enable_python: off
            enable_octave: off
            enable_memcheck: off
            force_update: on
            sanitizer: address
          - name: "Leak Sanitizer"
            os: ubuntu-22.04
            mode: Debug
            enable_python: off
            enable_octave: off
            enable_memcheck: off
            force_update: on
            sanitizer: leak
          - name: "Thread Sanitizer"
            os: ubuntu-22.04
            mode: Debug
            enable_python: off
            enable_octave: off
            enable_memcheck: off
            force_update: on
            sanitizer: thread
            # ctest alone takes most of the 30 min default: 29m12s passed and
            # one run cancelled at 30 min after all tests passed (#445)
            timeout_minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
        if: matrix.enable_R == 'on'

      - name: Define local variables
        shell: bash
        run: |
          echo "MODE=${{matrix.mode}}"                           >> $GITHUB_ENV
          echo "ENABLE_PYTHON_BINDING=${{matrix.enable_python}}" >> $GITHUB_ENV
          echo "ENABLE_OCTAVE_BINDING=${{matrix.enable_octave}}" >> $GITHUB_ENV
          echo "ENABLE_R_BINDING=${{matrix.enable_R}}"           >> $GITHUB_ENV
          echo "ENABLE_COVERAGE=${{matrix.enable_coverage}}"     >> $GITHUB_ENV
          echo "ENABLE_MEMCHECK=${{matrix.enable_memcheck}}"     >> $GITHUB_ENV
          echo "SANITIZE=${{matrix.sanitizer}}"                  >> $GITHUB_ENV

      - name: Define local variables Unix Like
        shell: bash
        run: |
          if [ "${ENABLE_R_BINDING}" == "on" ]; then
            echo "BUILD_NAME=r-linux-macos"  >> $GITHUB_ENV
          else
            echo "BUILD_NAME=linux-macos"    >> $GITHUB_ENV
          fi
        if: runner.os != 'Windows'

      - name: Define local variables Windows
        shell: bash
        run: |
          if [ "${ENABLE_OCTAVE_BINDING}" == "on" ]; then
            echo "BUILD_NAME=octave-windows" >> $GITHUB_ENV
          elif [ "${ENABLE_R_BINDING}" == "on" ]; then
            echo "BUILD_NAME=r-windows"      >> $GITHUB_ENV
          else
            echo "BUILD_NAME=windows"        >> $GITHUB_ENV
          fi
        if: runner.os == 'Windows'

      - name: pre-install-linux
        shell: bash
        run: |
          if [ "${{matrix.force_update}}" == "on" ]; then
            tools/linux-macos/apt-install.sh --update
          fi
          tools/linux-macos/apt-install.sh liblapack-dev python3-pip
          # OpenBLAS 0.3.20 Cooperlake kernels are wrong on Xeon 6973P-C (main.yml, #429)
          echo "OPENBLAS_CORETYPE=Haswell" >> $GITHUB_ENV
          if [ "${ENABLE_OCTAVE_BINDING}" == "on" ]; then
            tools/linux-macos/apt-install.sh --no-install-recommends octave liboctave-dev libopenblas0 gnuplot-nox
          fi
          if [ "${ENABLE_MATLAB_BINDING}" == "on" ]; then
            tools/linux-macos/apt-install.sh intel-mkl
          fi
          if [ "${ENABLE_R_BINDING}" == "on" ]; then
            tools/linux-macos/apt-install.sh liblapack-dev gfortran # r-base
          fi
          if [ "${ENABLE_COVERAGE}" == "on" ]; then
            tools/linux-macos/apt-install.sh lcov
          fi
          if [ "${ENABLE_MEMCHECK}" == "on" ]; then
            tools/linux-macos/apt-install.sh valgrind python3-setuptools
          fi
        if: runner.os == 'Linux' # or use $RUNNER_OS

      - name: install
        shell: bash
        run: tools/${BUILD_NAME}/install.sh

      - name: Setup cmake
        uses: lukka/get-cmake@v4.3.2
        with:
          cmakeVersion: '~3.24.0'

      - name: before_script
        shell: bash
        run: tools/common/before_script.sh

      - name: script
        shell: bash
        run: tools/${BUILD_NAME}/build.sh

      - name: test
        shell: bash
        run: tools/${BUILD_NAME}/test.sh

      - name: display Coverage report
        shell: bash
        run: |
          cd build
          lcov --list coverage.info
        if: matrix.enable_coverage == 'on'

      - name: publish Coveralls report
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: ./build/coverage.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.enable_coverage == 'on'
