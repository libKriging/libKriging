name: Debug 429 (OpenBLAS on Xeon 6973P-C)

# TEMPORARY workflow for #429, to be removed with .github/debug-429/ and the
# '!ccr-143ce523-yoxpqv' exclusions of the other workflows.
#
# Each replica lands on whatever CPU GitHub gives it; several replicas raise
# the odds of an Intel Xeon 6973P-C. Every replica logs the runner / CPU
# identification, then
#   1. checks BLAS / LAPACK results (.github/debug-429/blas_check.c) against a
#      long double reference, for each OpenBLAS kernel set and thread count;
#   2. on a suspect CPU (Intel with avx512_bf16) or wrong BLAS results only,
#      builds the C++ core and runs ctest with the kernels OpenBLAS picks by
#      itself (no OPENBLAS_CORETYPE), then reruns the failures under other
#      kernel sets / one thread.
# The jobs do not fail on wrong results: the step summary and the annotations
# carry the outcome.

on:
  push:
    branches:
      - 'ccr-143ce523-yoxpqv'
  workflow_dispatch:

# a new push cancels the previous probe run (the API token cannot cancel runs)
concurrency:
  group: debug-429-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBUG_CI: true
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  probe:
    if: false # diagnosis done (#429), see the commit message
    name: "probe (${{ matrix.os }} #${{ matrix.replica }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # cheap when the CPU is not suspect (no build): many replicas
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          # OpenBLAS 0.3.26: control (AMD EPYC 9V74 seen: Cooperlake kernels, correct)
          - os: ubuntu-24.04
            replica: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install BLAS (as the Octave Linux job)
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy liblapack-dev
          # libopenblas0-pthread is what `apt install octave` pulls on 22.04;
          # its alternatives take libblas.so.3 / liblapack.so.3 over.
          sudo apt-get install -qy libopenblas0-pthread
          update-alternatives --display libblas.so.3-x86_64-linux-gnu || true
          update-alternatives --display liblapack.so.3-x86_64-linux-gnu || true
          dpkg -l | grep -E "openblas|liblapack|libblas" || true

      - name: runner architecture
        id: arch
        shell: bash
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }} runner.name=${{ runner.name }}"
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          uname -a
          cat /etc/os-release | grep -E "^(PRETTY_NAME|VERSION_ID)="
          ldd --version | head -1
          gcc --version | head -1
          echo "nproc=$(nproc)"
          echo "---- lscpu"
          LC_ALL=C lscpu
          echo "---- /proc/cpuinfo (first CPU)"
          awk '/^$/{exit} {print}' /proc/cpuinfo
          echo "---- cpuid / xcr0"
          gcc -O1 -o "$RUNNER_TEMP/cpuid" .github/debug-429/cpuid.c
          "$RUNNER_TEMP/cpuid" | tee "$RUNNER_TEMP/cpuid.txt"
          echo "---- OpenBLAS kernel choice"
          python3 - <<'PYEOF' | tee "$RUNNER_TEMP/openblas.txt"
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_config.restype = ctypes.c_char_p
          lib.openblas_get_corename.restype = ctypes.c_char_p
          print(f"{lib.openblas_get_config().decode()} | core: {lib.openblas_get_corename().decode()} | threads: {lib.openblas_get_num_threads()}")
          PYEOF
          model="$(LC_ALL=C lscpu | sed -n 's/^Model name: *//p')"
          core="$(sed -n 's/.*| core: \([^ |]*\).*/\1/p' "$RUNNER_TEMP/openblas.txt")"
          bf16="$(sed -n 's/.*avx512_bf16=\([01]\).*/\1/p' "$RUNNER_TEMP/cpuid.txt")"
          fp16="$(sed -n 's/.*avx512_fp16=\([01]\).*/\1/p' "$RUNNER_TEMP/cpuid.txt")"
          xcr0="$(sed -n 's/.*xcr0=\(0x[0-9a-f]*\).*/\1/p' "$RUNNER_TEMP/cpuid.txt")"
          fms="$(sed -n 's/.*(display family=\([^ ]*\) model=\([^)]*\)).*/\1\/\2/p' "$RUNNER_TEMP/cpuid.txt")"
          echo "::notice title=runner ${{ matrix.os }} #${{ matrix.replica }}::${{ runner.arch }} | ${model} | family/model ${fms} | avx512_bf16=${bf16} avx512_fp16=${fp16} xcr0=${xcr0} | OpenBLAS core ${core} | image ${ImageVersion:-?}"
          {
            echo "### ${{ matrix.os }} #${{ matrix.replica }}"
            echo ""
            echo "| arch | CPU | family/model | avx512_bf16 | avx512_fp16 | xcr0 | OpenBLAS auto core | image |"
            echo "|---|---|---|---|---|---|---|---|"
            echo "| ${{ runner.arch }} | ${model} | ${fms} | ${bf16} | ${fp16} | ${xcr0} | ${core} | ${ImageVersion:-?} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "auto_core=${core}" >> "$GITHUB_OUTPUT"
          vendor="$(sed -n 's/^vendor=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/cpuid.txt")"
          # suspect: Intel with avx512_bf16 (Xeon 6973P-C and the like), where
          # OpenBLAS 0.3.20 takes its Cooperlake path
          if [ "$vendor" == "GenuineIntel" ] && [ "$bf16" == "1" ]; then
            echo "suspect=true" >> "$GITHUB_OUTPUT"
          else
            echo "suspect=false" >> "$GITHUB_OUTPUT"
          fi

      - name: BLAS / LAPACK check per kernel set
        id: blas
        shell: bash
        run: |
          gcc -O2 -o "$RUNNER_TEMP/blas_check" .github/debug-429/blas_check.c \
            /usr/lib/x86_64-linux-gnu/liblapack.so.3 /usr/lib/x86_64-linux-gnu/libblas.so.3 -ldl -lm
          ldd "$RUNNER_TEMP/blas_check" | grep -E "blas|lapack"
          {
            echo "| OPENBLAS_CORETYPE | threads | core used | cases | fails | worst case | ratio |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for coretype in auto Cooperlake SkylakeX Haswell Sandybridge Prescott; do
            for threads in 4 1; do
              echo "==== OPENBLAS_CORETYPE=${coretype} OPENBLAS_NUM_THREADS=${threads}"
              if [ "$coretype" == "auto" ]; then unset OPENBLAS_CORETYPE; else export OPENBLAS_CORETYPE=$coretype; fi
              out="$(OPENBLAS_NUM_THREADS=$threads "$RUNNER_TEMP/blas_check" 2>&1)" || echo "exit code $?"
              echo "$out" | head -60
              s="$(echo "$out" | grep '^SUMMARY' || echo 'SUMMARY core=crash threads=? cases=? fails=? worst=? ratio=?')"
              get() { echo "$s" | sed -n "s/.* $1=\([^ ]*\).*/\1/p"; }
              echo "| ${coretype} | ${threads} | $(get core) | $(get cases) | $(get fails) | $(get worst) | $(get ratio) |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$(get fails)" != "0" ]; then
                echo "fails=true" >> "$GITHUB_OUTPUT"
                echo "::error title=wrong BLAS results::OPENBLAS_CORETYPE=${coretype} threads=${threads} core=$(get core): $(get fails) failing cases, worst $(get worst) ratio $(get ratio)"
              fi
            done
          done
          unset OPENBLAS_CORETYPE
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: build C++ core and tests
        if: steps.arch.outputs.suspect == 'true' || steps.blas.outputs.fails == 'true'
        shell: bash
        run: |
          export MODE=Release ENABLE_PYTHON_BINDING=off ENABLE_OCTAVE_BINDING=off ENABLE_MATLAB_BINDING=off \
                 ENABLE_R_BINDING=off ENABLE_JULIA_BINDING=off BUILD_NAME=linux-macos
          tools/linux-macos/install.sh
          tools/common/before_script.sh
          tools/linux-macos/build.sh

      - name: ctest with the kernels OpenBLAS picks
        if: steps.arch.outputs.suspect == 'true' || steps.blas.outputs.fails == 'true'
        shell: bash
        run: |
          unset OPENBLAS_CORETYPE
          cd build
          for f in $(find . -type f \( -name KrigingTest -o -name "libKriging.so*" \) | head -2); do echo "$f:"; ldd "$f" | grep -E "blas|lapack|gomp"; done || true
          set +e
          ctest -C Release -j "$(nproc)" --output-on-failure --timeout 900 > ctest-auto.log 2>&1
          rc=$?
          set -e
          tail -150 ctest-auto.log
          failed="$(grep -cE '^\s+[0-9]+ - .*\((Failed|SEGFAULT|Subprocess aborted|Timeout|Exception)' ctest-auto.log || true)"
          summary="$(grep -E 'tests passed|tests failed' ctest-auto.log | tail -1)"
          echo "ctest (core ${{ steps.arch.outputs.auto_core }}): ${summary:-rc=$rc}"
          {
            echo "**ctest, core ${{ steps.arch.outputs.auto_core }} (auto):** ${summary:-rc=$rc}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error title=ctest auto core::core ${{ steps.arch.outputs.auto_core }}: ${summary}"
            cp Testing/Temporary/LastTestsFailed.log failed-auto.log
            for cfg in "OPENBLAS_CORETYPE=Haswell" "OPENBLAS_CORETYPE=SkylakeX" "OPENBLAS_CORETYPE=Cooperlake" "OPENBLAS_NUM_THREADS=1" "OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1"; do
              echo "==== rerun failed with ${cfg}"
              cp failed-auto.log Testing/Temporary/LastTestsFailed.log
              set +e
              env $cfg ctest -C Release -j "$(nproc)" --rerun-failed --output-on-failure --timeout 900 > "ctest-rerun.log" 2>&1
              set -e
              s="$(grep -E 'tests passed|tests failed' ctest-rerun.log | tail -1)"
              echo "${cfg}: ${s}"
              grep -E '^\s+[0-9]+ - ' ctest-rerun.log | head -30 || true
              echo "- rerun of the failures with \`${cfg}\`: ${s}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-429-${{ matrix.os }}-${{ matrix.replica }}
          path: |
            build/ctest-*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # Intel SDE emulates the CPUID and instruction set of a given CPU on any x86
  # runner: -gnr Granite Rapids (Xeon 6973P-C family), -cpx Cooper Lake, -spr
  # Sapphire Rapids. Discriminates an OpenBLAS 0.3.20 kernel-selection bug
  # (reproduced under emulation) from a hardware / hypervisor one (not).
  sde:
    if: false # diagnosis done (#429)
    name: "sde (ubuntu-22.04, OpenBLAS 0.3.20)"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install BLAS and Intel SDE
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy liblapack-dev
          sudo apt-get install -qy libopenblas0-pthread
          mkdir -p "$RUNNER_TEMP/sde"
          for u in \
            https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-lin.tar.xz \
            https://downloadmirror.intel.com/831748/sde-external-9.44.0-2024-08-22-lin.tar.xz \
            https://downloadmirror.intel.com/823664/sde-external-9.38.0-2024-04-18-lin.tar.xz \
            https://downloadmirror.intel.com/813591/sde-external-9.33.0-2024-01-07-lin.tar.xz; do
            echo "trying $u"
            if curl -sSfL -A "Mozilla/5.0" -o "$RUNNER_TEMP/sde.tar.xz" "$u"; then
              tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1 && break
            fi
          done
          ls "$RUNNER_TEMP/sde/sde64"
          echo "SDE=$RUNNER_TEMP/sde/sde64" >> "$GITHUB_ENV"
          LC_ALL=C lscpu | grep -E "^(Model name|Vendor ID)"

      - name: OpenBLAS kernel choice and BLAS check under emulation
        id: blas
        shell: bash
        run: |
          gcc -O1 -o "$RUNNER_TEMP/cpuid" .github/debug-429/cpuid.c
          gcc -O2 -o "$RUNNER_TEMP/blas_check" .github/debug-429/blas_check.c \
            /usr/lib/x86_64-linux-gnu/liblapack.so.3 /usr/lib/x86_64-linux-gnu/libblas.so.3 -ldl -lm
          {
            echo "### SDE (OpenBLAS 0.3.20, host $(LC_ALL=C lscpu | sed -n 's/^Model name: *//p'))"
            echo ""
            echo "| SDE CPU | OPENBLAS_CORETYPE | threads | core used | cases | fails | worst case | ratio |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for emu in gnr cpx spr skx; do
            echo "==== sde -${emu}"
            "$SDE" -${emu} -- "$RUNNER_TEMP/cpuid" || echo "cpuid under sde -${emu}: exit $?"
            for coretype in auto Haswell; do
              for threads in 4 1; do
                if [ "$coretype" == "auto" ]; then unset OPENBLAS_CORETYPE; else export OPENBLAS_CORETYPE=$coretype; fi
                echo "---- sde -${emu} OPENBLAS_CORETYPE=${coretype} threads=${threads}"
                out="$(OPENBLAS_NUM_THREADS=$threads timeout 1200 "$SDE" -${emu} -- "$RUNNER_TEMP/blas_check" 2>&1)" || echo "exit code $?"
                echo "$out" | head -60
                s="$(echo "$out" | grep '^SUMMARY' || echo 'SUMMARY core=crash threads=? cases=? fails=? worst=? ratio=?')"
                get() { echo "$s" | sed -n "s/.* $1=\([^ ]*\).*/\1/p"; }
                echo "| ${emu} | ${coretype} | ${threads} | $(get core) | $(get cases) | $(get fails) | $(get worst) | $(get ratio) |" >> "$GITHUB_STEP_SUMMARY"
                echo "::notice title=sde -${emu} ${coretype} ${threads}t::core $(get core): $(get fails) failing cases, worst $(get worst) ratio $(get ratio)"
              done
            done
          done
          unset OPENBLAS_CORETYPE
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: build C++ core and tests
        shell: bash
        run: |
          export MODE=Release ENABLE_PYTHON_BINDING=off ENABLE_OCTAVE_BINDING=off ENABLE_MATLAB_BINDING=off \
                 ENABLE_R_BINDING=off ENABLE_JULIA_BINDING=off BUILD_NAME=linux-macos
          tools/linux-macos/install.sh
          tools/common/before_script.sh
          tools/linux-macos/build.sh

      - name: libKriging tests under emulation
        shell: bash
        run: |
          cd build
          for t in LinearAlgebraTest KrigingLogLikTest; do
            bin="$(find . -type f -name "$t" | head -1)"
            echo "$t -> ${bin:-not found}"; [ -n "$bin" ] || continue
            ldd "$bin" | grep -E "blas|lapack|Kriging" || true
            for emu in gnr cpx; do
              for coretype in auto Haswell; do
                if [ "$coretype" == "auto" ]; then unset OPENBLAS_CORETYPE; else export OPENBLAS_CORETYPE=$coretype; fi
                echo "==== $t sde -${emu} OPENBLAS_CORETYPE=${coretype}"
                set +e
                timeout 1800 "$SDE" -${emu} -- "$bin" --reporter compact > "sde-$t-$emu-$coretype.log" 2>&1
                rc=$?
                set -e
                tail -5 "sde-$t-$emu-$coretype.log"
                last="$(grep -E '^(Passed|Failed|test cases)' "sde-$t-$emu-$coretype.log" | tail -1)"
                echo "- \`$t\` sde -${emu}, OPENBLAS_CORETYPE=${coretype}: rc=${rc} ${last}" >> "$GITHUB_STEP_SUMMARY"
                echo "::notice title=$t sde -${emu} ${coretype}::rc=${rc} ${last}"
              done
            done
          done
          unset OPENBLAS_CORETYPE

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-429-sde
          path: build/sde-*.log
          if-no-files-found: ignore
