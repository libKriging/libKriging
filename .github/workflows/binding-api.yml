name: Binding API

# Compares the methods exposed by the Python, R, Octave and Julia bindings
# (#419). One Linux job per binding (one version of the target language)
# builds it and lists its methods (tools/checks/binding_api/dump_<binding>);
# the compare job matches the names across bindings, up to the naming
# conventions of each language (tools/checks/binding_api/compare.py), and
# fails on any method missing from some bindings (errors; --report-only on
# compare.py makes them warnings). The arguments of the methods (Python, R,
# Julia) are compared too, as warnings only. The log and the job summary end
# with a synthesis table of all the compared methods.

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '*'

env:
  # see main.yml: needed by the pinned pybind11 submodule with cmake >= 4
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  MODE: Release
  BUILD_TEST: false # bindings only (install.lib target)

jobs:
  methods:
    name: ${{ matrix.binding }} methods
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        binding: [python, r, octave, julia]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
        if: matrix.binding == 'r'

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
        if: matrix.binding == 'julia'

      - name: Setup cmake
        uses: lukka/get-cmake@v4.3.2
        with:
          cmakeVersion: '~4.2.0'

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy liblapack-dev
          case "${{ matrix.binding }}" in
            octave) sudo apt-get install -qy octave liboctave-dev ;;
            r)      sudo apt-get install -qy gfortran ;;
          esac
          if [ "${{ matrix.binding }}" == "python" ]; then
            python3 -m pip install -r bindings/Python/pylibkriging/requirements.txt \
                                   -r bindings/Python/pylibkriging/dev-requirements.txt
          fi

      - name: Build
        shell: bash
        run: |
          export ENABLE_PYTHON_BINDING=off ENABLE_OCTAVE_BINDING=off ENABLE_MATLAB_BINDING=off ENABLE_JULIA_BINDING=off
          case "${{ matrix.binding }}" in
            python) ENABLE_PYTHON_BINDING=on tools/linux-macos/build.sh ;;
            octave) ENABLE_OCTAVE_BINDING=on tools/linux-macos/build.sh ;;
            julia)  ENABLE_JULIA_BINDING=on tools/linux-macos/build.sh ;;
            r)
              # as tools/r-linux-macos/build.sh, without the C++ tests
              CC=$(R CMD config CC) CXX=$(R CMD config CXX) \
                EXTRA_CMAKE_OPTIONS="-DBUILD_SHARED_LIBS=off -DSTATIC_LIB=on" \
                tools/linux-macos/build.sh
              export LIBKRIGING_PATH=${PWD}/build/installed
              cd bindings/R
              MAKEFLAGS=-j$(nproc) MAKE_SHARED_LIBS=off STATIC_LIB=on make
              ;;
          esac

      - name: List the methods of the binding
        shell: bash
        run: |
          DUMP=${PWD}/build/${{ matrix.binding }}.txt
          case "${{ matrix.binding }}" in
            python)
              PYTHONPATH=build/bindings/Python/pylibkriging:bindings/Python/pylibkriging/src \
                python3 tools/checks/binding_api/dump_python.py "${DUMP}" ;;
            r)
              R_LIBS=bindings/R/Rlibs Rscript tools/checks/binding_api/dump_r.R "${DUMP}" ;;
            octave)
              octave-cli --path build/bindings/Octave/mlibkriging --path bindings/Octave/mlibkriging \
                --path tools/checks/binding_api --eval "dump_octave('${DUMP}')" ;;
            julia)
              JLIBKRIGING_LIB_PATH=${PWD}/build/bindings/Julia/jlibkriging/libkriging_c.so \
                julia --project=bindings/Julia/jlibkriging tools/checks/binding_api/dump_julia.jl "${DUMP}" ;;
          esac
          cat "${DUMP}"

      # smoke calls with the argument types a user passes (non blocking: the
      # failures are warnings and listed in the job summary)
      - name: Smoke calls of the binding
        shell: bash
        run: |
          SMOKE_DIR=tools/checks/binding_api
          case "${{ matrix.binding }}" in
            python)
              PYTHONPATH=build/bindings/Python/pylibkriging:bindings/Python/pylibkriging/src \
                python3 ${SMOKE_DIR}/smoke_python.py "${GITHUB_STEP_SUMMARY}" ;;
            r)
              R_LIBS=bindings/R/Rlibs Rscript ${SMOKE_DIR}/smoke_r.R "${GITHUB_STEP_SUMMARY}" ;;
            octave)
              octave-cli --path build/bindings/Octave/mlibkriging --path bindings/Octave/mlibkriging \
                --path ${SMOKE_DIR} --eval "n = smoke_octave('${SMOKE_DIR}', '${GITHUB_STEP_SUMMARY}'); exit(n > 0)" ;;
            julia)
              JLIBKRIGING_LIB_PATH=${PWD}/build/bindings/Julia/jlibkriging/libkriging_c.so \
                julia --project=bindings/Julia/jlibkriging ${SMOKE_DIR}/smoke_julia.jl "${GITHUB_STEP_SUMMARY}" ;;
          esac || echo "::warning::${{ matrix.binding }}: some smoke calls failed (see the log and the job summary)"

      - uses: actions/upload-artifact@v4
        with:
          name: binding-api-${{ matrix.binding }}
          path: build/${{ matrix.binding }}.txt

  compare:
    needs: methods
    if: always() # compare the bindings whose build succeeded
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: binding-api-*
          merge-multiple: true
          path: dumps

      - name: Compare the methods of the bindings
        shell: bash
        run: |
          # the public methods of the C++ API: each one is exposed by a binding
          # or excepted with a reason (--cpp-report-only until the exception
          # list is confirmed by a run on the four bindings)
          python3 tools/checks/binding_api/dump_cpp.py cpp.txt
          python3 tools/checks/binding_api/compare.py --cpp cpp.txt --cpp-report-only \
            --markdown "$GITHUB_STEP_SUMMARY" dumps/*.txt
